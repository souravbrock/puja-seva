name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../gbps-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gbps-web
          path: gbps-web.zip

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      # Capacitor shell is generated in CI so the repo stays web-first.
      - run: npm i -D @capacitor/cli @capacitor/core @capacitor/android && npx cap add android --web-dir dist || true
      - run: npx cap sync android
      - working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk gbps-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gbps-apk
          path: gbps-app-debug.apk

  github-release:
    runs-on: ubuntu-latest
    needs: [web, android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: (cd artifacts/gbps-web && sha256sum gbps-web.zip > ../SHA256SUMS.txt); (cd artifacts/gbps-apk && sha256sum gbps-app-debug.apk >> ../SHA256SUMS.txt); cat artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gbps-web/gbps-web.zip
            artifacts/gbps-apk/gbps-app-debug.apk
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
