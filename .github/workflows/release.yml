name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../gbps-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gbps-web
          path: gbps-web.zip

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      # android/ platform is committed; just sync the fresh web build into it.
      - run: npx cap sync android
      # Stable release signature (same key every run, so updates install cleanly).
      # Path must match android/app's project dir (see build.gradle).
      - name: Decode signing key
        run: echo "${{ secrets.GBPS_KEYSTORE_B64 }}" | base64 -d > android/app/release.keystore
      - working-directory: android
        env:
          GBPS_KEYSTORE_FILE: release.keystore
          GBPS_KEYSTORE_PASSWORD: ${{ secrets.GBPS_KEYSTORE_PASSWORD }}
          GBPS_KEY_ALIAS: ${{ secrets.GBPS_KEY_ALIAS }}
          GBPS_KEY_PASSWORD: ${{ secrets.GBPS_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk gbps-app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gbps-apk
          path: gbps-app-release.apk

  github-release:
    runs-on: ubuntu-latest
    needs: [web, android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: (cd artifacts/gbps-web && sha256sum gbps-web.zip > ../SHA256SUMS.txt); (cd artifacts/gbps-apk && sha256sum gbps-app-release.apk >> ../SHA256SUMS.txt); cat artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gbps-web/gbps-web.zip
            artifacts/gbps-apk/gbps-app-release.apk
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
